<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSS MATH SOLVER AI</title>
<style>
body {background:#0a0a0a; color:#fff; font-family:'Segoe UI', sans-serif; text-align:center; padding:20px;}
h1 {color:#00ff88; text-shadow:0 0 10px #00ff88; font-size:24px; margin:0;}
.subtitle {color:#aaa; margin-bottom:20px;}
.box {background:#111; border:2px solid #00ff88; border-radius:15px; padding:20px; box-shadow:0 0 20px #00ff88;}
input {width:90%; padding:12px; border-radius:10px; border:none; font-size:16px; margin-bottom:15px;}
.btn {padding:12px; margin:5px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; width:45%;}
.orange {background:linear-gradient(90deg,#ff9500,#ff5e00); color:#fff;}
.blue {background:linear-gradient(90deg,#00c6ff,#0072ff); color:#fff;}
.green {background:linear-gradient(90deg,#00ff88,#00cc66); color:#fff;}
.purple {background:linear-gradient(90deg,#a855f7,#7e22ce); color:#fff;}
.red {background:linear-gradient(90deg,#ff0044,#cc0033); color:#fff; width:92%;}
.output {background:#000; border-radius:10px; padding:15px; margin-top:15px; text-align:left; min-height:100px; color:#00ff88; white-space:pre-line;}
.hint {color:#00ff88; font-size:14px; margin-top:10px;}
.hint span {text-decoration:underline; cursor:pointer;}
.exam {color:#ff9500; font-weight:bold;}
.loading {color:#ff9500;}
.error {color:#ff0044;}
.listening {background:#ff9500!important;}
</style>
</head>
<body>

<h1>📱 JSS MATH SOLVER AI</h1>
<p class="subtitle">100% GROQ AI POWERED - NO MIXING</p>

<div class="box">
<p class="exam">⏰ Exam Mode: <span id="examStatus">OFF</span></p>

<input type="text" id="question" placeholder="Ask any math question....">

<button class="btn orange" id="listenBtn" onclick="listen()">🎤 LISTEN</button>
<button class="btn green" onclick="solve()">✨ SOLVE</button>

<button class="btn blue" onclick="speak()">🔊 SPEAK</button>
<button class="btn green" onclick="timer()">⏰ TIMER</button>

<button class="btn purple" onclick="savePDF()">📄 SAVE PDF</button>
<button class="btn purple" onclick="history()">📚 HISTORY</button>

<button class="btn red" onclick="clearAll()">🗑️ CLEAR</button>

<div class="output" id="output">Welcome to JSS AI Solver!</div>

</div>

<script>
let historyList = [];
let examMode = false;
let recognition;

// SAFE KEY: ASKS USER ONCE AND SAVES
const AI_KEY = localStorage.getItem("groq_key") || prompt("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") || "";
localStorage.setItem("groq_key", AI_KEY);

function fill(text){
  document.getElementById('question').value = text;
  solve();
}

// REAL VOICE LISTENING
function listen(){
  const btn = document.getElementById('listenBtn');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if(!SpeechRecognition){
    alert("🎤 Voice not supported on this browser. Use Chrome.");
    return;
  }
  
  recognition = new SpeechRecognition();
  recognition.lang = 'en-NG'; // Nigerian English
  recognition.start();
  
  btn.classList.add('listening');
  btn.innerText = "🎤 LISTENING...";
  
  recognition.onresult = function(event){
    let transcript = event.results[0][0].transcript;
    document.getElementById('question').value = transcript;
    btn.classList.remove('listening');
    btn.innerText = "🎤 LISTEN";
    solve(); // auto solve after listening
  };
  
  recognition.onerror = function(){
    alert("Microphone error. Allow microphone permission.");
    btn.classList.remove('listening');
    btn.innerText = "🎤 LISTEN";
  };
}

async function solve(){
  const outputBox = document.getElementById('output');
  let q = document.getElementById('question').value.trim();
  if(q === ""){ outputBox.innerHTML = `<span class="error">Please type a question first!</span>`; return; }
  if(AI_KEY === ""){ outputBox.innerHTML = `<span class="error">❌ Paste your Groq API key first!</span>`; return; }

  outputBox.innerHTML = `<span class="loading">🧠 Groq AI is solving...</span>`;
  await askGroq(q);
}

async function askGroq(question){
  const outputBox = document.getElementById('output');
  const prompt = `You are JSS MATH SOLVER for Nigerian JSS 1-3 students. Solve step by step: "${question}". Use simple English. Final Answer bold.`;

  try{
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + AI_KEY },
      body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: [{ role: "user", content: prompt }] })
    });

    if(!response.ok) throw new Error(`Status ${response.status}. Key invalid or no credit.`);
    const data = await response.json();
    showAnswer(data.choices[0].message.content, question);

  }catch(err){
    outputBox.innerHTML = `<span class="error">❌ ${err.message}</span>`;
  }
}

function showAnswer(ans, q){
  document.getElementById('output').innerText = ans;
  historyList.push(q + "\n" + ans);
}

function clearAll(){ document.getElementById('question').value = ""; document.getElementById('output').innerText = "Welcome to JSS AI Solver!"; }
function speak(){ let txt = document.getElementById('output').innerText; if('speechSynthesis' in window){ let speech = new SpeechSynthesisUtterance(txt); speech.lang = 'en-NG'; window.speechSynthesis.speak(speech); }else{ alert("🔊 Speech not supported") }
function timer(){ examMode =!examMode; document.getElementById('examStatus').innerText = examMode? "ON 30min" : "OFF"; }
function savePDF(){ alert("📄 PDF - Will add jsPDF library next") }
function history(){ alert(historyList.length>0? historyList.slice(-5).join("\n\n---\n\n") : "No history yet") }
</script>
</body>
</html>
