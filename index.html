<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSS MATH SOLVER AI</title>
<style>
body {background:#0a0a0a; color:#fff; font-family:'Segoe UI', sans-serif; text-align:center; padding:15px;}
h1 {color:#00ff88; text-shadow:0 0 10px #00ff88; font-size:22px;}
.box {background:#111; border:2px solid #00ff88; border-radius:15px; padding:15px;}
input {width:90%; padding:12px; border-radius:10px; border:none; font-size:15px; margin-bottom:10px;}
.btn {padding:12px; margin:5px; border:none; border-radius:10px; font-weight:bold; width:45%; font-size:14px;}
.orange {background:#ff9500; color:#fff;}.green {background:#00ff88; color:#000;} 
.blue {background:#0072ff; color:#fff;}.red {background:#ff0044; color:#fff; width:92%;}
.output {background:#000; border-radius:10px; padding:15px; margin-top:15px; text-align:left; min-height:100px; color:#00ff88;}
.hidden {display:none;} /* THIS HIDES THE KEY BOX */
</style>
</head>
<body>
<h1>📱 JSS MATH SOLVER AI</h1>
<div class="box">

<!-- KEY BOX IS HIDDEN -->
<div class="hidden">
<input type="password" id="apiKey">
</div>

<input type="text" id="question" placeholder="Ask any math question....">
<button class="btn orange" onclick="listen()">🎤 LISTEN</button>
<button class="btn green" onclick="solve()">✨ SOLVE</button>
<button class="btn blue" onclick="speak()">🔊 SPEAK</button>
<button class="btn red" onclick="clearAll()">🗑️ CLEAR</button>
<div class="output" id="output">Welcome to JSS AI Solver!</div>
</div>
<script>
// AUTO LOAD KEY - NO BUTTON NEEDED
document.getElementById('apiKey').value = localStorage.getItem("groq_key") || "";

function getKey(){ return localStorage.getItem("groq_key") || ""; }

async function solve(){
  let q = document.getElementById('question').value.trim(); 
  let AI_KEY = getKey();
  if(q === "" || AI_KEY === ""){ 
    document.getElementById('output').innerText = "❌ No key found. Open on computer once and paste key in console."; 
    return; 
  }
  document.getElementById('output').innerText = "🧠 Solving...";
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + AI_KEY },
    body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: [{ role: "user", content: "Solve for JSS student: "+q }] })
  });
  const data = await res.json(); 
  document.getElementById('output').innerText = data.choices[0].message.content;
}
function listen(){ alert("🎤 Tap and allow mic") }
function speak(){ let txt = document.getElementById('output').innerText; window.speechSynthesis.speak(new SpeechSynthesisUtterance(txt)); }
function clearAll(){ document.getElementById('question').value=""; document.getElementById('output').innerText="Welcome!"; }
</script>
</body>
</html>
