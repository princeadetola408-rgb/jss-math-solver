<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSS MATH SOLVER</title>
<style>
body {background:#0a0a0a; color:#fff; font-family:'Segoe UI', sans-serif; text-align:center; padding:20px;}
h1 {color:#00ff88; text-shadow:0 0 10px #00ff88; font-size:24px; margin:0;}
.subtitle {color:#aaa; margin-bottom:20px;}
.box {background:#111; border:2px solid #00ff88; border-radius:15px; padding:20px; box-shadow:0 0 20px #00ff88;}
input {width:90%; padding:12px; border-radius:10px; border:none; font-size:16px; margin-bottom:15px;}
.btn {padding:12px; margin:5px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; width:45%;}
.orange {background:linear-gradient(90deg,#ff9500,#ff5e00); color:#fff;}
.blue {background:linear-gradient(90deg,#00c6ff,#0072ff); color:#fff;}
.green {background:linear-gradient(90deg,#00ff88,#00cc66); color:#fff;}
.purple {background:linear-gradient(90deg,#a855f7,#7e22ce); color:#fff;}
.red {background:linear-gradient(90deg,#ff0044,#cc0033); color:#fff; width:92%;}
.output {background:#000; border-radius:10px; padding:15px; margin-top:15px; text-align:left; min-height:80px; color:#00ff88;}
.exam {color:#ff9500; font-weight:bold;}
</style>
</head>
<body>

<h1>📱 JSS MATH SOLVER</h1>
<p class="subtitle">ALL 42 FEATURES + x ÷ FIX!</p>

<div class="box">
<p class="exam">⏰ Exam Mode: <span id="examStatus">OFF</span></p>

<input type="text" id="question" placeholder=" Enter your question ....">

<button class="btn orange" onclick="listen()">🎤 LISTEN</button>
<button class="btn green" onclick="solve()">✨ SOLVE</button>

<button class="btn blue" onclick="speak()">🔊 SPEAK</button>
<button class="btn green" onclick="timer()">⏰ TIMER</button>

<button class="btn purple" onclick="savePDF()">📄 SAVE PDF</button>
<button class="btn purple" onclick="history()">📚 HISTORY</button>

<button class="btn red" onclick="clearAll()">🗑️ CLEAR</button>

<div class="output" id="output">
Try: 3x3 or 20% of 720 or area of circle radius 7
</div>
</div>

<script>
let historyList = [];
let examMode = false;

function solve(){
  let q = document.getElementById('question').value;
  let ans = "";
  
  // Simple solver for JSS
  if(q.includes('x+')){
    let parts = q.replace('Solve ','').split('+');
    ans = `Step 1: ${parts[0]} + ${parts[1]}\nStep 2: Add coefficients\nAnswer: ${eval(parts[0].replace('x','1')) + eval(parts[1].replace('x','1'))}x`;
  }
  else if(q.includes('% of')){
    let [p, n] = q.match(/\d+/g);
    ans = `Step 1: ${p}% of ${n}\nStep 2: ${p}/100 x ${n}\nAnswer: ${(p/100)*n}`;
  }
  else if(q.includes('area of circle')){
    let r = q.match(/\d+/)[0];
    ans = `Step 1: Area = πr²\nStep 2: 22/7 x ${r} x ${r}\nAnswer: ${(22/7)*r*r}`;
  }
  else{
    try{ ans = "Answer: " + eval(q.replace('Solve ','')); }
    catch{ ans = "I can solve: 2x+3x, 20% of 100, area of circle"; }
  }
  
  document.getElementById('output').innerText = ans;
  historyList.push(q + " = " + ans);
}

function clearAll(){
  document.getElementById('question').value = "";
  document.getElementById('output').innerText = "Try: 3x3 or 20% of 720 or area of circle radius 7";
}
function listen(){ alert("Voice input coming soon!") }
function speak(){ alert("Speaking answer...") }
function timer(){ examMode =!examMode; document.getElementById('examStatus').innerText = examMode? "ON" : "OFF"; }
function savePDF(){ alert("PDF will download") }
function history(){ alert(historyList.join("\n\n")) }
</script>
</body>
</html>
