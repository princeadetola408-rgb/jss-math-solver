<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSS MATH SOLVER AI</title>
<style>
body {background:#0a0a0a; color:#fff; font-family:'Segoe UI', sans-serif; text-align:center; padding:15px;}
h1 {color:#00ff88; text-shadow:0 0 10px #00ff88; font-size:22px;}
.box {background:#111; border:2px solid #00ff88; border-radius:15px; padding:15px;}
input {width:90%; padding:12px; border-radius:10px; border:none; font-size:15px; margin-bottom:10px;}
.btn {padding:12px; margin:5px; border:none; border-radius:10px; font-weight:bold; width:45%; font-size:14px; cursor:pointer;}
.orange {background:#ff9500; color:#fff;}.green {background:#00ff88; color:#000;} 
.blue {background:#0072ff; color:#fff;}.red {background:#ff0044; color:#fff; width:92%;}
.output {background:#000; border-radius:10px; padding:15px; margin-top:15px; text-align:left; min-height:100px; color:#00ff88; white-space:pre-wrap;}
</style>
</head>
<body>
<h1>📱 JSS MATH SOLVER AI</h1>
<div class="box">

<input type="text" id="question" placeholder="Ask any math question....">
<button class="btn orange" onclick="listen()">🎤 LISTEN</button>
<button class="btn green" onclick="solve()">✨ SOLVE</button>
<button class="btn blue" onclick="speak()">🔊 SPEAK</button>
<button class="btn red" onclick="clearAll()">🗑️ CLEAR</button>
<div class="output" id="output">Welcome to JSS AI Solver!</div>
</div>
<script>
// NO KEY HERE ANYMORE - IT'S SAFE IN BACKEND NOW ✅

// REAL VOICE TO TEXT
function listen(){
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
    alert("Mic not supported. Use Chrome.");
    return;
  }
  let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = 'en-US';
  recognition.onstart = () => { document.getElementById('output').innerText = "🎤 Listening... speak now"; }
  recognition.onresult = (e) => {
    let text = e.results[0][0].transcript;
    document.getElementById('question').value = text;
    document.getElementById('output').innerText = "✅ Got: " + text;
  }
  recognition.onerror = () => { document.getElementById('output').innerText = "❌ Mic error. Check permission."; }
  recognition.start();
}

// SOLVE WITH YOUR BACKEND
async function solve(){
  let q = document.getElementById('question').value.trim(); 
  if(q === ""){ 
    document.getElementById('output').innerText = "❌ Type a question first"; 
    return; 
  }
  document.getElementById('output').innerText = "🧠 Solving...";
  try{
    // THIS IS THE FIX: Call your own backend instead of Groq directly
    const res = await fetch("/api/solve", {
      method: "POST", 
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q })
    });
    const data = await res.json(); 
    if(data.error) {
      document.getElementById('output').innerText = "❌ " + data.error;
    } else {
      document.getElementById('output').innerText = data.answer;
    }
  } catch(e){
    document.getElementById('output').innerText = "❌ Error. Check internet.";
  }
}

function speak(){ 
  let txt = document.getElementById('output').innerText; 
  window.speechSynthesis.speak(new SpeechSynthesisUtterance(txt)); 
}

function clearAll(){ 
  document.getElementById('question').value=""; 
  document.getElementById('output').innerText="Welcome to JSS AI Solver!"; 
}
</script>
</body>
</html>
